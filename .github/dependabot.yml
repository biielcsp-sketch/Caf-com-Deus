# Atualizações só depois de 7 dias publicadas (cooldown): evita pacotes comprometidos recém-lançados.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dependencias-menores:
        update-types: [minor, patch]
    # Saltos de versão grandes (ex.: TypeScript 5→7, ESLint 9→10) quebram o build e são feitos
    # à mão, num PR próprio. Correções de segurança continuam chegando por aqui normalmente.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
